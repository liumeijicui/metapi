# 边缘版（只转发 + 使用日志）桌面安装包配置。
#
# 与 electron-builder.yml 的区别：
# - 独立 appId / 产品名 / 产物名，装出来是另一个应用，不会覆盖完整版。
# - extraMetadata 把 metapiBuildVariant=edge 写进应用元数据，桌面壳据此改用
#   dist/server/edge/main.js 入口、独立数据目录与 127.0.0.1:30086（见 src/desktop/runtime.ts）。
# - 不带 publish 配置：边缘版不参与自动更新。
appId: me.cita777.metapi.edge
productName: Metapi Edge
artifactName: ${name}-edge-${version}-${os}-${arch}.${ext}
directories:
  output: release/edge
electronDist: node_modules/electron/dist
icon: build/desktop-icon.png
asar: false
# better-sqlite3 是原生模块，必须换成 Electron ABI 版本才能被 exe 里的服务进程加载；
# 这一步由 scripts/desktop/packEdgeDesktop.mjs 按 ABI 替换完成。
# 关掉 electron-builder 自带的 @electron/rebuild：它依赖的 node-abi 还不认识 Electron 42 的 ABI，
# 开启时会直接以「无法探测 ABI」中止打包。
npmRebuild: false
extraMetadata:
  metapiBuildVariant: edge
  # Electron 按 package.json 的 productName 决定 userData 目录；不写的话边缘版和完整版
  # 会共用 %APPDATA%\metapi，两个 Chromium 实例同时跑会互相抢同一个用户数据目录。
  productName: Metapi Edge
files:
  - dist/**/*
  - drizzle/**/*
  - package.json
win:
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

